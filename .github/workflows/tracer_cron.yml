name: Git AI Tracer Auto-Scan & Dashboard

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_user:
        description: 'GitHub username to scan (leave empty for repository owner)'
        required: false
        default: ''
      max_repos:
        description: 'Max repositories to scan'
        required: false
        default: '100'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/tracer_cron.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Git AI Tracer
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Execute AI Tracer Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_USER="${{ github.event.inputs.target_user }}"
          if [ -z "$TARGET_USER" ]; then
            TARGET_USER="${{ github.repository_owner }}"
          fi
          MAX_REPOS="${{ github.event.inputs.max_repos }}"
          if [ -z "$MAX_REPOS" ]; then
            MAX_REPOS="100"
          fi
          
          echo "Scanning GitHub user: $TARGET_USER (Limit: $MAX_REPOS)"
          git-ai-tracer scan --user "$TARGET_USER" --limit "$MAX_REPOS"

      - name: Commit and Push Updated Metrics
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/metrics.json badges/ docs/index.html AI_METRICS.md
          if git diff --staged --quiet; then
            echo "No changes in AI metrics."
          else
            git commit -m "chore(tracer): auto-update AI usage metrics and badges [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  deploy:
    needs: scan-and-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
