name: Git AI Tracer Auto-Scan & Dashboard

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode: "ecosystem" (all public GitHub repos) or "user" (specific profile)'
        required: true
        default: 'ecosystem'
      target_user:
        description: 'GitHub username to scan (only used if scan_mode is user)'
        required: false
        default: ''
      repos_per_topic:
        description: 'Sample repos per topic to index (ecosystem mode)'
        required: false
        default: '8'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/tracer_cron.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Git AI Tracer
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Execute AI Tracer Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCAN_MODE="${{ github.event.inputs.scan_mode }}"
          if [ -z "$SCAN_MODE" ]; then
            SCAN_MODE="ecosystem"
          fi
          
          if [ "$SCAN_MODE" = "user" ]; then
            TARGET_USER="${{ github.event.inputs.target_user }}"
            if [ -z "$TARGET_USER" ]; then
              TARGET_USER="${{ github.repository_owner }}"
            fi
            echo "Scanning public repositories for user: $TARGET_USER"
            git-ai-tracer scan --user "$TARGET_USER"
          else
            REPOS_PER_TOPIC="${{ github.event.inputs.repos_per_topic }}"
            if [ -z "$REPOS_PER_TOPIC" ]; then
              REPOS_PER_TOPIC="8"
            fi
            echo "Scanning global public GitHub ecosystem (Repos per topic: $REPOS_PER_TOPIC)..."
            git-ai-tracer track-ecosystem --repos-per-topic "$REPOS_PER_TOPIC"
          fi

      - name: Commit and Push Updated Metrics
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Fetch any remote changes that occurred during the scan
          git fetch origin main
          git rebase origin/main || true
          git add data/metrics.json badges/ docs/index.html AI_METRICS.md
          if git diff --staged --quiet; then
            echo "No changes in AI metrics."
          else
            git commit -m "chore(tracer): auto-update AI usage metrics and badges [skip ci]"
            git push origin main
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  deploy:
    needs: scan-and-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
